name: Fix Blueprint installer input

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix interactive reads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('blueprint.sh')
          s = p.read_text()
          lines = []
          changed = False
          for line in s.splitlines(keepends=True):
              if 'read -r -p ' in line and '< /dev/tty' not in line:
                  newline = line.rstrip('\n')
                  ending = '\n' if line.endswith('\n') else ''
                  if ';' in newline:
                      newline = newline.replace(';', ' < /dev/tty;', 1)
                  else:
                      newline += ' < /dev/tty'
                  line = newline + ending
                  changed = True
              lines.append(line)
          p.write_text(''.join(lines))
          if not changed:
              print('No interactive read changes needed.')
          PY
          bash -n blueprint.sh

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-blueprint-input.yml
          git add blueprint.sh .github/workflows/fix-blueprint-input.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: make Blueprint installer prompts use terminal input'
          git push