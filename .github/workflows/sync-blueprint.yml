name: Sync working Blueprint installer
on:
  push:
    paths:
      - '.github/workflows/sync-blueprint.yml'
      - 'blueprint.sh'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CDN
        uses: actions/checkout@v4
      - name: Copy working LAB blueprint.sh
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/ROOTSUNNYLAB1/LAB/main/blueprint.sh -o blueprint.sh
          chmod +x blueprint.sh
      - name: Commit exact LAB copy
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blueprint.sh
          if git diff --cached --quiet; then
            echo 'blueprint.sh is already synchronized.'
            exit 0
          fi
          git commit -m 'Sync blueprint.sh from LAB'
          git push
