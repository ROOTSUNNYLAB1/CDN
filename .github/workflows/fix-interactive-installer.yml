name: Fix installer terminal input

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch interactive reads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('blueprint.sh')
          s = p.read_text()
          replacements = {
              'read -r -p "$1 [y/N] " a;': 'read -r -p "$1 [y/N] " a < /dev/tty;',
              "read -r -p 'Select [0-3]: ' c": "read -r -p 'Select [0-3]: ' c < /dev/tty",
              "read -r -p 'GitHub repository (organization/repository): ' r;": "read -r -p 'GitHub repository (organization/repository): ' r < /dev/tty;",
              "read -r phrase;": "read -r phrase < /dev/tty;",
              "read -r -p 'Select an option [0-11]: ' c;": "read -r -p 'Select an option [0-11]: ' c < /dev/tty;",
              "read -r -p 'Press Enter to continue...' _;": "read -r -p 'Press Enter to continue...' _ < /dev/tty;",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
          bash -n blueprint.sh
      - name: Commit fixed installer and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-interactive-installer.yml
          git add blueprint.sh .github/workflows/fix-interactive-installer.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make installer fully interactive from curl'
          git push
